<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-labelledby="d-title d-desc">
  <title id="d-title">A stick figure dancing because flow completion went up 45 percent</title>
  <desc id="d-desc">An original stick figure swings its arms side to side on a flashing dance floor next to the caption: POV, the dashboard after we fixed the flow.</desc>
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFCF9"/>
      <stop offset="1" stop-color="#F4EFE5"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink  { fill: none; stroke: #14110F; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .body { animation: sway .9s ease-in-out infinite alternate; transform-origin: 190px 186px; }
    @keyframes sway { from { transform: translateX(-14px) rotate(-3deg); } to { transform: translateX(14px) rotate(3deg); } }
    .head { animation: bop .45s ease-in-out infinite alternate; }
    @keyframes bop { from { transform: translateY(0); } to { transform: translateY(4px); } }
    .armL { transform-origin: 190px 100px; animation: armL .9s ease-in-out infinite alternate; }
    .armR { transform-origin: 190px 100px; animation: armR .9s ease-in-out infinite alternate; }
    @keyframes armL { 0%, 18% { transform: rotate(22deg); } 82%, 100% { transform: rotate(-158deg); } }
    @keyframes armR { 0%, 18% { transform: rotate(158deg); } 82%, 100% { transform: rotate(-22deg); } }
    .legL { transform-origin: 190px 142px; animation: legL .9s ease-in-out infinite alternate; }
    .legR { transform-origin: 190px 142px; animation: legR .9s ease-in-out infinite alternate; }
    @keyframes legL { from { transform: rotate(10deg); } to { transform: rotate(-6deg); } }
    @keyframes legR { from { transform: rotate(6deg); } to { transform: rotate(-10deg); } }
    .tile { animation: tile 1.8s steps(1) infinite; }
    .tile.t2 { animation-delay: -.45s; }
    .tile.t3 { animation-delay: -.9s; }
    .tile.t4 { animation-delay: -1.35s; }
    @keyframes tile { 0% { fill: #FF4F2E; } 25% { fill: #F5B800; } 50% { fill: #0E9F8E; } 75% { fill: #4F46E5; } }
    .note { animation: note 2.4s ease-out infinite; opacity: 0; }
    .note.n2 { animation-delay: .8s; }
    .note.n3 { animation-delay: 1.6s; }
    @keyframes note { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -46px) rotate(18deg); } }
    .pct { animation: pct .9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 100%; }
    @keyframes pct { from { transform: scale(1); } to { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .note { opacity: 1; } }
  </style>

  <rect width="840" height="240" rx="20" fill="url(#dbg)"/>
  <rect x=".5" y=".5" width="839" height="239" rx="20" fill="none" stroke="#E2DDD2"/>

  <!-- dance floor -->
  <rect class="tile"    x="70"  y="192" width="58" height="14" rx="4" fill="#FF4F2E"/>
  <rect class="tile t2" x="132" y="192" width="58" height="14" rx="4" fill="#F5B800"/>
  <rect class="tile t3" x="194" y="192" width="58" height="14" rx="4" fill="#0E9F8E"/>
  <rect class="tile t4" x="256" y="192" width="58" height="14" rx="4" fill="#4F46E5"/>

  <!-- music notes -->
  <g class="mono" font-size="22" font-weight="700">
    <text class="note"    x="262" y="92"  fill="#FF4F2E">&#9834;</text>
    <text class="note n2" x="102" y="84"  fill="#0E9F8E">&#9835;</text>
    <text class="note n3" x="280" y="132" fill="#4F46E5">&#9834;</text>
  </g>

  <!-- dancer -->
  <g class="body">
    <line class="ink legL" x1="190" y1="142" x2="164" y2="188"/>
    <line class="ink legR" x1="190" y1="142" x2="216" y2="188"/>
    <line class="ink" x1="190" y1="92" x2="190" y2="142"/>
    <line class="ink armL" x1="190" y1="100" x2="148" y2="100"/>
    <line class="ink armR" x1="190" y1="100" x2="232" y2="100"/>
    <g class="head">
      <circle cx="190" cy="68" r="19" fill="#FF4F2E"/>
      <circle cx="183" cy="65" r="2.4" fill="#14110F"/>
      <circle cx="197" cy="65" r="2.4" fill="#14110F"/>
      <path d="M182 73 q8 8 16 0" fill="none" stroke="#14110F" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- caption -->
  <text class="mono" x="380" y="78" font-size="14" fill="#6B665E" letter-spacing="2">POV</text>
  <text class="sans" x="380" y="116" font-size="26" font-weight="700" fill="#14110F">the dashboard after we</text>
  <text class="sans" x="380" y="148" font-size="26" font-weight="700" fill="#14110F">fixed the flow</text>
  <text class="mono pct" x="380" y="190" font-size="20" font-weight="700" fill="#E03E1F">completion &#9650; 45%</text>
</svg>

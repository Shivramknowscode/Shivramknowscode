<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="840" height="190" role="img" aria-labelledby="j-title j-desc">
  <title id="j-title">Mumbai to Milan to New York</title>
  <desc id="j-desc">A paper plane flies a dotted route from Mumbai through Milan to New York, where Shiv is based now.</desc>

  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFCF9"/>
      <stop offset="1" stop-color="#F4EFE5"/>
    </linearGradient>
    <pattern id="jdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#14110F" opacity="0.08"/>
    </pattern>
    <path id="route" d="M120 104 Q270 -10 420 96 Q570 -10 720 96"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .dash { fill: none; stroke: #A8A196; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1 9; animation: march 1.2s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -10; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .ring.r2 { animation-delay: .8s; }
    .ring.r3 { animation-delay: 1.6s; }
    @keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="840" height="190" rx="20" fill="url(#jbg)"/>
  <rect width="840" height="190" rx="20" fill="url(#jdots)"/>

  <rect x=".5" y=".5" width="839" height="189" rx="20" fill="none" stroke="#E2DDD2"/>
  <use href="#route" class="dash"/>

  <!-- Mumbai -->
  <circle class="ring" cx="120" cy="104" r="7" fill="none" stroke="#FF6B4A" stroke-width="2"/>
  <circle cx="120" cy="104" r="6" fill="#FF6B4A"/>
  <text class="mono" x="120" y="140" font-size="20" font-weight="700" fill="#14110F" text-anchor="middle">BOM</text>
  <text class="sans" x="120" y="160" font-size="12" fill="#6B665E" text-anchor="middle">Mumbai</text>

  <!-- Milan -->
  <circle class="ring r2" cx="420" cy="96" r="7" fill="none" stroke="#F5B800" stroke-width="2"/>
  <circle cx="420" cy="96" r="6" fill="#F5B800"/>
  <text class="mono" x="420" y="132" font-size="20" font-weight="700" fill="#14110F" text-anchor="middle">MXP</text>
  <text class="sans" x="420" y="152" font-size="12" fill="#6B665E" text-anchor="middle">Milan</text>

  <!-- New York -->
  <circle class="ring r3" cx="720" cy="96" r="7" fill="none" stroke="#0E9F8E" stroke-width="2"/>
  <circle cx="720" cy="96" r="6" fill="#0E9F8E"/>
  <text class="mono" x="720" y="132" font-size="20" font-weight="700" fill="#14110F" text-anchor="middle">NYC</text>
  <text class="sans" x="720" y="152" font-size="12" fill="#0E9F8E" text-anchor="middle">New York, now</text>

  <!-- paper plane -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" calcMode="spline"
      keyPoints="0;0.5;0.5;1;1" keyTimes="0;0.4;0.5;0.9;1"
      keySplines=".4 0 .2 1; 0 0 1 1; .4 0 .2 1; 0 0 1 1">
      <mpath href="#route"/>
    </animateMotion>
    <path d="M-12 -8 L14 0 L-12 8 L-6 0 Z" fill="#14110F" stroke="#FDFCF9" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
